name: MLB StatsAPI Ensemble

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -U pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: |
          pytest -q
      - name: Folders
        run: mkdir -p data models src
      - name: Pipeline
        run: |
          export PYTHONPATH=$(pwd):$PYTHONPATH
          python main.py
      - uses: actions/upload-artifact@v4
        with:
          name: mlb-predictions-${{ github.run_id }}
          path: |
            predictions.csv
            data/
            models/
          retention-days: 14
